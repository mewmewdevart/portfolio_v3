<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#140d1c">
  <title>Larissa · Design e código</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/gsap.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="titulo">
      <div class="hero__copy">
        <p class="hero__name">Larissa <span>/</span> Mewmew</p>
        <h1 id="titulo">Design<br>e <em>código.</em></h1>
        <p class="hero__intro">Sou web designer. Crio interfaces e dou vida a elas com código.</p>
        <p class="hero__hint" hidden>Mova o mouse e acompanhe o olhar.</p>
      </div>

      <div class="hero__art">
        <div class="portrait" data-portrait>
          <div class="eye eye--screen-left" aria-hidden="true">
            <img class="iris" src="assets/hero-iris-direita.png" alt="">
          </div>
          <div class="eye eye--screen-right" aria-hidden="true">
            <img class="iris" src="assets/hero-iris-esquerda.png" alt="">
          </div>
          <img class="portrait__face" src="assets/Personagem-sem-olhos.png"
            width="1254" height="1254" alt="Retrato ilustrado de Larissa, com cabelo afro, piercings e detalhes roxos.">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
